{% extends 'layout.html' %}

{% block content%}

<table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Name</th>
      <th scope="col">Email</th>
      <th scope="col">Phone</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
   {% for students in student %}
    <tr>
      <td>{{loop.index}}</td>
      <td>{{students.name}}</td>
      <td>{{students.email}}</td>
      <td>{{students.phone}}</td>
       <td>
                <a href="{{url_for('editstudent', id=students._id)}}" class="btn btn-dark">Edit</a>
                <a href="{{url_for('deletestudent', id=students._id)}}" class="btn btn-danger">Delete</a>
            </td>
    </tr>
   {% endfor %}

  
  </tbody>
</table>
{% endblock %}
